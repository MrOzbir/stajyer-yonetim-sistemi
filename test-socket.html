<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>💬 Socket.io Chat Test</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0; padding: 20px; background: #f0f2f5;
        }
        .container { max-width: 900px; margin: 0 auto; }
        
        .setup { 
            background: white; padding: 20px; border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px;
        }
        
        .chat-container { display: flex; gap: 20px; }
        
        .chat-panel {
            flex: 1; background: white; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden;
            display: flex; flex-direction: column; height: 600px;
        }
        
        .chat-header {
            padding: 15px 20px; background: #0084ff; color: white;
            display: flex; align-items: center; gap: 10px;
        }
        .chat-header .status {
            width: 10px; height: 10px; border-radius: 50%;
            background: #ccc; display: inline-block;
        }
        .chat-header .status.online { background: #4ade80; }
        
        .messages {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 8px;
            background: #f7f8fa;
        }
        
        .message {
            max-width: 70%; padding: 10px 14px; border-radius: 18px;
            word-wrap: break-word; animation: fadeIn 0.3s;
        }
        .message.mine {
            align-self: flex-end; background: #0084ff; color: white;
            border-bottom-right-radius: 4px;
        }
        .message.theirs {
            align-self: flex-start; background: #e4e6eb; color: #050505;
            border-bottom-left-radius: 4px;
        }
        .message .time {
            font-size: 10px; opacity: 0.7; margin-top: 4px;
            display: block;
        }
        
        .typing-indicator {
            padding: 0 20px 8px; font-size: 12px; color: #65676b;
            font-style: italic; height: 20px;
        }
        
        .input-area {
            padding: 12px; border-top: 1px solid #e4e6eb;
            display: flex; gap: 8px;
        }
        .input-area input {
            flex: 1; padding: 10px 15px; border: 1px solid #ddd;
            border-radius: 20px; outline: none; font-size: 14px;
        }
        .input-area input:focus { border-color: #0084ff; }
        .input-area button {
            padding: 10px 20px; background: #0084ff; color: white;
            border: none; border-radius: 20px; cursor: pointer;
            font-weight: 600;
        }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }
        
        input[type="text"], input[type="number"] {
            padding: 8px 12px; border: 1px solid #ddd;
            border-radius: 6px; outline: none;
        }
        input:focus { border-color: #0084ff; }
        button { 
            padding: 8px 16px; background: #0084ff; color: white;
            border: none; border-radius: 6px; cursor: pointer;
            font-weight: 500;
        }
        button:hover { background: #0073e6; }
        button.danger { background: #ef4444; }
        
        .log {
            background: #1e1e1e; color: #0f0; padding: 15px;
            border-radius: 8px; font-family: monospace; font-size: 12px;
            height: 200px; overflow-y: auto; margin-top: 20px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading { text-align: center; color: #666; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 Socket.io Chat Test Paneli</h1>

        <!-- BAĞLANTI KURULUMU -->
        <div class="setup">
            <h3>1️⃣ Bağlantı Kur</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                <input type="text" id="token" placeholder="JWT Token (login sonrası alın)" style="flex: 1; min-width: 300px;">
                <input type="number" id="otherUserId" placeholder="Karşı taraf ID" value="2" style="width: 130px;">
                <button onclick="connect()">🔌 Bağlan</button>
                <button class="danger" onclick="disconnect()">❌ Kopar</button>
                <span id="connectionStatus">🔴 Bağlı değil</span>
            </div>
        </div>

        <!-- SOHBET ARAYÜZÜ -->
        <div class="chat-container">
            <div class="chat-panel">
                <div class="chat-header">
                    <span class="status" id="otherStatus"></span>
                    <div>
                        <div style="font-weight: 600;" id="otherName">Kullanıcı</div>
                        <div style="font-size: 12px; opacity: 0.9;" id="otherStatusText">Offline</div>
                    </div>
                </div>

                <div class="messages" id="messages">
                    <div class="loading">Önce bağlanın...</div>
                </div>

                <div class="typing-indicator" id="typingIndicator"></div>

                <div class="input-area">
                    <input type="text" id="messageInput" placeholder="Mesaj yazın..." disabled 
                           onkeydown="handleKeyPress(event)">
                    <button onclick="sendMessage()" id="sendBtn" disabled>📤 Gönder</button>
                </div>
            </div>
        </div>

        <!-- TEKNİK LOG -->
        <details style="margin-top: 20px;">
            <summary style="cursor: pointer; font-weight: 600;">🔧 Teknik Log (Geliştirici için)</summary>
            <div id="log" class="log"></div>
        </details>
    </div>

    <script>
        let socket = null;
        let myUserId = null;
        let otherUserId = null;
        let typingTimeout = null;
        let isCurrentlyTyping = false;
        let typingReceivedTimeout = null;

        // =========================
        // 📝 LOG VE UI YARDIMCILARI
        // =========================
        function log(msg, color = '#0f0') {
            const el = document.getElementById('log');
            const time = new Date().toLocaleTimeString('tr-TR');
            el.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
        }

        function scrollToBottom() {
            const el = document.getElementById('messages');
            el.scrollTop = el.scrollHeight;
        }

        function addMessageToUI(msg) {
            const container = document.getElementById('messages');
            // Loading mesajini temizle
            const loading = container.querySelector('.loading');
            if (loading) loading.remove();

            const isMine = msg.sender.id === myUserId;
            const div = document.createElement('div');
            div.className = `message ${isMine ? 'mine' : 'theirs'}`;
            
            const time = new Date(msg.timestamp).toLocaleTimeString('tr-TR', {
                hour: '2-digit', minute: '2-digit'
            });
            
            div.innerHTML = `
                <div>${escapeHtml(msg.content)}</div>
                <span class="time">${time}</span>
            `;
            container.appendChild(div);
            scrollToBottom();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // =========================
        // 🔌 SOCKET BAĞLANTISI
        // =========================
        async function connect() {
            const token = document.getElementById('token').value;
            otherUserId = parseInt(document.getElementById('otherUserId').value);

            if (!token) { alert('Token gerekli!'); return; }
            if (!otherUserId) { alert('Karşı taraf ID gerekli!'); return; }

            // Token'dan kendi ID'mizi çıkar (JWT decode - basit yol)
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                myUserId = payload.userId;
                log(`👤 Kendi ID'niz: ${myUserId}`, '#0af');
            } catch (e) {
                log('⚠️ Token decode edilemedi', '#ff0');
            }

            log(`🔌 Bağlanılıyor...`, '#ff0');

            socket = io('http://localhost:5001', {
                auth: { token: token },
                transports: ['websocket']
            });

            socket.on('connect', async () => {
                log(`✅ Bağlandı! Socket ID: ${socket.id}`, '#0f0');
                document.getElementById('connectionStatus').innerText = '🟢 Bağlı';
                document.getElementById('messageInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;

                // 🎯 BAĞLANTI SONRASI: Geçmiş mesajları REST ile çek
                await loadMessageHistory();
            });

            socket.on('connect_error', (err) => {
                log(`❌ Bağlantı hatası: ${err.message}`, '#f00');
                document.getElementById('connectionStatus').innerText = '🔴 Hata';
            });

            socket.on('disconnect', () => {
                log('🔌 Bağlantı koptu', '#ff0');
                document.getElementById('connectionStatus').innerText = '🔴 Kopuk';
                document.getElementById('messageInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;
            });

            socket.on('online_users', (data) => {
                log(`👥 Online: ${data.userIds.join(', ')} (${data.count})`, '#0af');
                // Karşı taraf online mı?
                const isOnline = data.userIds.includes(otherUserId);
                document.getElementById('otherStatus').className = 
                    `status ${isOnline ? 'online' : ''}`;
                document.getElementById('otherStatusText').innerText = 
                    isOnline ? 'Çevrimiçi' : 'Çevrimdışı';
            });

            socket.on('new_message', (msg) => {
                // Sadece bu konuşmaya ait mesajları UI'a ekle
                const relevant = 
                    (msg.sender.id === myUserId && msg.receiver.id === otherUserId) ||
                    (msg.sender.id === otherUserId && msg.receiver.id === myUserId);
                
                if (relevant) {
                    addMessageToUI(msg);
                    log(`💬 Mesaj alındı: ${msg.content.substring(0, 30)}...`, '#0f0');
                }
            });

            socket.on('user_typing', (data) => {
                if (data.userId === otherUserId) {
                    const indicator = document.getElementById('typingIndicator');
                    if (data.isTyping) {
                        indicator.innerText = '✍️ Yazıyor...';
                        // 3 saniye sonra otomatik temizle (karşı taraf unutup stop atmazsa)
                        clearTimeout(typingReceivedTimeout);
                        typingReceivedTimeout = setTimeout(() => {
                            indicator.innerText = '';
                        }, 3000);
                    } else {
                        indicator.innerText = '';
                        clearTimeout(typingReceivedTimeout);
                    }
                }
            });

            socket.on('error', (err) => {
                log(`🚨 Hata: ${err.message}`, '#f00');
            });
        }

        function disconnect() {
            if (socket) { socket.disconnect(); socket = null; }
        }

        // =========================
        // 📜 GEÇMİŞ MESAJLARI YÜKLE
        // =========================
        async function loadMessageHistory() {
            const token = document.getElementById('token').value;
            log(`📜 Geçmiş mesajlar yükleniyor (REST)...`, '#ff0');
            
            try {
                const response = await fetch(
                    `http://localhost:5001/api/messages/${otherUserId}`,
                    {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }
                );
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                log(`📜 ${data.messages.length} geçmiş mesaj yüklendi`, '#0f0');
                
                // UI'ı temizle
                document.getElementById('messages').innerHTML = '';
                
                // Mesajları sırayla ekle (zaten asc sıralı geldi)
                if (data.messages.length === 0) {
                    document.getElementById('messages').innerHTML = 
                        '<div class="loading">Henüz mesaj yok. İlk mesajı siz gönderin! 👋</div>';
                } else {
                    data.messages.forEach(msg => addMessageToUI(msg));
                }
                
            } catch (error) {
                log(`❌ Geçmiş yükleme hatası: ${error.message}`, '#f00');
            }
        }

        // =========================
        // 💬 MESAJ GÖNDERME
        // =========================
        function sendMessage() {
            if (!socket) { alert('Önce bağlanın!'); return; }
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content) return;

            socket.emit('send_message', { receiverId: otherUserId, content });
            input.value = '';
            
            // Yazmayı durdur
            if (isCurrentlyTyping) {
                socket.emit('typing', { receiverId: otherUserId, isTyping: false });
                isCurrentlyTyping = false;
                clearTimeout(typingTimeout);
            }
            
            input.focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
                return;
            }
            
            // 🎯 OTOMATİK "YAZIYOR" MANTIĞI (Debounce)
            if (!socket) return;
            
            if (!isCurrentlyTyping) {
                // İlk tuş basımı: yazıyor sinyali gönder
                socket.emit('typing', { receiverId: otherUserId, isTyping: true });
                isCurrentlyTyping = true;
                log('⌨️ typing=true gönderildi', '#ff0');
            }
            
            // 2 saniye sonra otomatik durdur (kullanıcı yazmayı bıraktıysa)
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                if (isCurrentlyTyping) {
                    socket.emit('typing', { receiverId: otherUserId, isTyping: false });
                    isCurrentlyTyping = false;
                    log('⌨️ typing=false gönderildi (2 sn timeout)', '#ff0');
                }
            }, 2000);
        }
    </script>
</body>
</html>
