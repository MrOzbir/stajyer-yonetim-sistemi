services:
  postgres:
    image: postgres:15-alpine
    container_name: stajyer-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stajyer_sistemi
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  ai-service:
    build:
      context: ./ai-service
    container_name: stajyer-ai-service
    restart: unless-stopped
    command: python main.py
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - MODEL_NAME=qwen3-local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  backend-api:
    build:
      context: ./backend-api
    container_name: stajyer-backend-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./backend-api/.env
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/stajyer_sistemi
      - PORT=5001
      - PYTHON_AI_SERVICE_URL=http://ai-service:8000/analyze
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      - postgres
      - ai-service
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5001/api
    container_name: stajyer-frontend
    restart: unless-stopped
    ports:
      - "5173:80" # Nginx içerde 80'de çalışır, biz 5173'ten erişeceğiz
    depends_on:
      - backend-api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
